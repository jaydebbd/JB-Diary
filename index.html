<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>ভয়েস দিয়ে ডায়েরি লিখুন</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f4f6f9; color:#222; }
    .card { width:min(92vw,480px); background:#fff; border-radius:20px; padding:24px; box-shadow:0 10px 40px rgba(0,0,0,.1); text-align:center; }
    .mic { width:90px; height:90px; border:0; border-radius:50%; background:linear-gradient(135deg,#6a1b9a,#8e24aa); color:#fff; font-size:38px; cursor:pointer; box-shadow:0 8px 20px rgba(106,27,154,.25); transition:.2s; }
    .mic.recording { background:linear-gradient(135deg,#d93025,#b31412); animation:pulse 1.2s infinite; }
    @keyframes pulse { 50% { box-shadow:0 0 0 12px rgba(217,48,37,.15); } }
    h1 { font-size:22px; margin:8px 0; color:#1a73e8; }
    #status { margin:10px 0; font-size:15px; font-weight:600; color:#555; }
    #live { min-height:90px; max-height:200px; overflow-y:auto; margin-top:14px; padding:12px; background:#f8fbff; border:1px solid #d2e3fc; border-radius:12px; text-align:left; font-size:15px; line-height:1.6; }
    .btn-finish { margin-top:16px; width:100%; padding:12px; background:#1e8e3e; color:#fff; border:0; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎙️ ভয়েস ডায়েরি</h1>
    <div id="status">মাইক্রোফোন চালু করতে চাপুন</div>
    <button id="mic" class="mic" type="button">🎙️</button>
    <div id="live">কথা বলুন, এখানে লেখা দেখা যাবে...</div>
    <button id="finishBtn" class="btn-finish" type="button">✅ ডায়েরিতে যোগ করুন ও ঠিক করুন</button>
  </main>

<script>
(function(){
  'use strict';

  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var parentOrigin = params.get('parentOrigin') || '';
  
  var recognition = null;
  var isRecording = false;
  var manualStop = false;
  var finalSpeech = '';
  var restartTimer = null;

  var mic = document.getElementById('mic');
  var status = document.getElementById('status');
  var live = document.getElementById('live');
  var finishBtn = document.getElementById('finishBtn');

  function initRecognition() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    var r = new SR();
    r.lang = 'bn-BD';
    r.continuous = true;
    r.interimResults = true;
    return r;
  }

  function sendToParentAndClose() {
    var text = finalSpeech.trim();
    if (!text) {
      status.textContent = '⚠️ কোনো কথা রেকর্ড হয়নি';
      return;
    }
    status.textContent = '📨 ডায়েরিতে পাঠানো হচ্ছে...';
    
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: 'DIARY_VOICE_TRANSCRIPT', token: token, text: text }, parentOrigin || '*');
      setTimeout(function(){
        window.close(); // লেখা পাঠানোর পর উইন্ডোটি নিজ থেকেই বন্ধ হয়ে যাবে
      }, 500);
    } else {
      status.textContent = '⚠️ মূল ডায়েরি উইন্ডো পাওয়া যায়নি';
    }
  }

  function startListening() {
    if (recognition) {
      try { recognition.abort(); } catch(e) {}
    }
    recognition = initRecognition();
    if (!recognition) return;

    recognition.onstart = function() {
      isRecording = true;
      mic.classList.add('recording');
      status.textContent = '🔴 কথা শুনছে... কথা বলা শেষে নিচের বাটনে চাপুন';
    };

    recognition.onresult = function(event) {
      var interim = '';
      for (var i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          var word = event.results[i][0].transcript.trim();
          if (word) {
            finalSpeech += (finalSpeech ? ' ' : '') + word; // নির্ভুল স্পেস সহ যোগ
          }
        } else {
          interim += event.results[i][0].transcript;
        }
      }
      live.textContent = (finalSpeech + (interim ? ' ' + interim : '')).trim() || 'কথা শুনছে...';
    };

    recognition.onend = function() {
      // যদি ইউজার নিজে বন্ধ না করে, তবে ব্রাউজার নিজে কেটে দিলে সাথে সাথে আবার চালু হবে
      if (!manualStop && isRecording) {
        clearTimeout(restartTimer);
        restartTimer = setTimeout(startListening, 150);
      } else {
        mic.classList.remove('recording');
        isRecording = false;
      }
    };

    recognition.onerror = function(event) {
      if (event.error !== 'no-speech') {
        status.textContent = 'ভয়েস ত্রুটি: ' + event.error;
      }
    };

    try {
      recognition.start();
    } catch(e) {}
  }

  mic.addEventListener('click', function() {
    if (!isRecording) {
      manualStop = false;
      finalSpeech = '';
      startListening();
    } else {
      manualStop = true;
      if (recognition) recognition.stop();
      status.textContent = 'থামানো হয়েছে';
    }
  });

  finishBtn.addEventListener('click', function() {
    manualStop = true;
    if (recognition) recognition.stop();
    sendToParentAndClose();
  });

  // পেজ লোড হলেই স্বয়ংক্রিয়ভাবে মাইক্রোফোন শুরু করা
  window.onload = function() {
    manualStop = false;
    startListening();
  };
})();
</script>
</body>
</html>
