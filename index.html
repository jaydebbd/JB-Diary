<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>ভয়েস নোটপ্যাড — অনলাইন ডায়েরি</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f4f9; color: #222; padding: 12px; }
    .card { width: min(100%, 540px); background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 10px 35px rgba(0,0,0,.08); text-align: center; }
    h1 { font-size: 20px; margin: 4px 0 12px; color: #1a73e8; }
    
    .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 14px; }
    .mic { width: 78px; height: 78px; border: 0; border-radius: 50%; background: linear-gradient(135deg,#6a1b9a,#8e24aa); color: #fff; font-size: 34px; cursor: pointer; box-shadow: 0 6px 18px rgba(106,27,154,.28); transition: .2s; }
    .mic.recording { background: linear-gradient(135deg,#d93025,#b31412); animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 14px rgba(217,48,37,.16); } }
    
    #status { font-size: 14px; font-weight: 600; color: #555; }
    
    .box-title { text-align: left; font-size: 13px; font-weight: 600; color: #666; margin-top: 10px; margin-bottom: 5px; }
    #noteArea {
      width: 100%;
      height: 180px;
      padding: 12px;
      font-size: 15.5px;
      line-height: 1.6;
      border: 1.5px solid #c2d7fa;
      border-radius: 12px;
      background: #fbfcfe;
      outline: none;
      resize: vertical;
      color: #2c3e50;
      font-family: inherit;
    }
    #noteArea:focus { border-color: #1a73e8; background: #fff; box-shadow: 0 0 0 2px rgba(26,115,232,0.15); }
    
    .action-btns { display: flex; gap: 10px; margin-top: 14px; }
    .btn-clear { flex: 1; padding: 12px; background: #f1f3f4; color: #555; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-submit { flex: 2; padding: 12px; background: #1e8e3e; color: #fff; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 3px 10px rgba(30,142,62,.25); }
    .btn-submit:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎙️ ভয়েস ডায়েরি নোট</h1>
    
    <div class="mic-wrap">
      <button id="micBtn" class="mic" type="button" title="রেকর্ড চালু/বন্ধ করুন">🎙</button>
      <div id="status">কথা বলতে মাইক চাপুন</div>
    </div>

    <div class="box-title">📝 লেখার বক্স (প্রয়োজনে সরাসরি এডিট করতে পারবেন):</div>
    <textarea id="noteArea" placeholder="মাইকে চাপ দিয়ে কথা বলুন, এখানে লেখা জমা হবে... আপনি চাইলে কিবোর্ড দিয়েও এখানে টাইপ বা সংশোধন করতে পারেন।"></textarea>

    <div class="action-btns">
      <button id="clearBtn" class="btn-clear" type="button">মুছে ফেলুন</button>
      <button id="submitBtn" class="btn-submit" type="button">✅ ডায়েরিতে পাঠান ও ঠিক করুন</button>
    </div>
  </main>

<script>
(function(){
  'use strict';

  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var parentOrigin = params.get('parentOrigin') || '*';

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;
  var isRecording = false;

  var micBtn = document.getElementById('micBtn');
  var status = document.getElementById('status');
  var noteArea = document.getElementById('noteArea');
  var clearBtn = document.getElementById('clearBtn');
  var submitBtn = document.getElementById('submitBtn');

  var textBeforeSpeech = '';

  function startRecognition() {
    if (!SR) {
      status.textContent = '⚠️ আপনার ব্রাউজারে Speech Recognition সাপোর্ট নেই';
      return;
    }

    recognition = new SR();
    recognition.lang = 'bn-BD';
    recognition.continuous = true;
    recognition.interimResults = true;

    // মাইক অন করার মুহূর্তে বক্সে আগে থেকে যা ছিল তা আলাদা সংরক্ষণ
    textBeforeSpeech = noteArea.value.trim();
    if (textBeforeSpeech) {
      textBeforeSpeech += ' ';
    }

    recognition.onstart = function() {
      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.innerHTML = '🛑';
      status.textContent = '🔴 কথা শুনছে... শেষ করতে আবার চাপুন';
    };

    recognition.onresult = function(event) {
      var finalTranscript = '';
      var interimTranscript = '';

      // প্রতিবার ০ (শূন্য) থেকে শুরু করে পুরো ফলাফল সঠিকভাবে নতুন করে তৈরি করা হচ্ছে
      // এতে মোবাইল ব্রাউজারে বারবার কথা ডুপ্লিকেট হবে না
      for (var i = 0; i < event.results.length; ++i) {
        var chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalTranscript += chunk + ' ';
        } else {
          interimTranscript += chunk;
        }
      }

      var currentSpeech = (finalTranscript + interimTranscript).trim();
      noteArea.value = textBeforeSpeech + currentSpeech;
      noteArea.scrollTop = noteArea.scrollHeight;
    };

    recognition.onerror = function(event) {
      if (event.error !== 'no-speech') {
        status.textContent = 'ভয়েস ত্রুটি: ' + event.error;
      }
    };

    recognition.onend = function() {
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.innerHTML = '🎙️';
      status.textContent = 'থামানো হয়েছে (আবার কথা বলতে মাইক চাপুন)';
    };

    try {
      recognition.start();
    } catch(e) {
      isRecording = false;
    }
  }

  function stopRecognition() {
    if (recognition) {
      recognition.stop();
    }
    isRecording = false;
  }

  micBtn.addEventListener('click', function() {
    if (!isRecording) {
      startRecognition();
    } else {
      stopRecognition();
    }
  });

  clearBtn.addEventListener('click', function() {
    if (confirm('আপনি কি বক্সের সব লেখা মুছে ফেলতে চান?')) {
      if (isRecording && recognition) recognition.abort();
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.innerHTML = '🎙️';
      noteArea.value = '';
      textBeforeSpeech = '';
      status.textContent = 'কথা বলতে মাইক চাপুন';
    }
  });

  // দ্রুত ও এক ক্লিকেই ডায়ালগ বন্ধ করে ডাটা পাঠানো
  submitBtn.addEventListener('click', function() {
    if (isRecording && recognition) {
      recognition.abort();
      isRecording = false;
    }

    var textToSend = noteArea.value.trim();
    if (!textToSend) {
      alert('বক্সে কোনো লেখা নেই!');
      return;
    }

    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({
        type: 'DIARY_VOICE_TRANSCRIPT',
        token: token,
        text: textToSend
      }, parentOrigin);

      // কোনো বিলম্ব ছাড়াই তৎক্ষণাৎ বন্ধ হবে
      window.close();
    } else {
      alert('মূল ডায়েরি উইন্ডো পাওয়া যায়নি। অনুগ্রহ করে ডায়েরির পেজ থেকে এটি খুলুন।');
      status.textContent = '⚠️ পাঠানো ব্যর্থ হয়েছে';
    }
  });

})();
</script>
</body>
</html>
