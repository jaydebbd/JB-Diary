<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>ভয়েস দিয়ে ডায়েরি লিখুন</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f4f6f9; color:#222; }
    .card { width:min(92vw,480px); background:#fff; border-radius:20px; padding:24px; box-shadow:0 10px 40px rgba(0,0,0,.1); text-align:center; }
    .mic { width:90px; height:90px; border:0; border-radius:50%; background:linear-gradient(135deg,#6a1b9a,#8e24aa); color:#fff; font-size:38px; cursor:pointer; box-shadow:0 8px 20px rgba(106,27,154,.25); transition:.2s; }
    .mic.recording { background:linear-gradient(135deg,#d93025,#b31412); animation:pulse 1.2s infinite; }
    @keyframes pulse { 50% { box-shadow:0 0 0 12px rgba(217,48,37,.15); } }
    h1 { font-size:22px; margin:8px 0; color:#1a73e8; }
    #status { margin:10px 0; font-size:15px; font-weight:600; color:#555; }
    #live { min-height:100px; max-height:220px; overflow-y:auto; margin-top:14px; padding:12px; background:#f8fbff; border:1px solid #d2e3fc; border-radius:12px; text-align:left; font-size:16px; line-height:1.6; white-space:pre-wrap; }
    .btn-finish { margin-top:16px; width:100%; padding:13px; background:#1e8e3e; color:#fff; border:0; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎙️ ভয়েস ডায়েরি</h1>
    <div id="status">মাইক্রোফোন চালু করতে চাপুন</div>
    <button id="mic" class="mic" type="button">🎙️</button>
    <div id="live">কথা বলুন, এখানে স্পষ্ট লেখা দেখা যাবে...</div>
    <button id="finishBtn" class="btn-finish" type="button">✅ ডায়েরিতে যোগ করুন ও ঠিক করুন</button>
  </main>

<script>
(function(){
  'use strict';

  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var parentOrigin = params.get('parentOrigin') || '';
  
  var recognition = null;
  var isRecording = false;
  var fullText = '';

  var mic = document.getElementById('mic');
  var status = document.getElementById('status');
  var live = document.getElementById('live');
  var finishBtn = document.getElementById('finishBtn');

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function sendToParentAndClose() {
    var text = fullText.trim();
    if (!text) {
      status.textContent = '⚠️ কোনো কথা রেকর্ড হয়নি';
      return;
    }
    status.textContent = '📨 ডায়েরিতে পাঠানো হচ্ছে...';
    
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: 'DIARY_VOICE_TRANSCRIPT', token: token, text: text }, parentOrigin || '*');
      setTimeout(function(){
        window.close();
      }, 400);
    } else {
      status.textContent = '⚠️ মূল ডায়েরি উইন্ডো পাওয়া যায়নি';
    }
  }

  function startListening() {
    if (!SR) {
      status.textContent = '⚠️ এই ব্রাউজারে ভয়েস সাপোর্ট নেই';
      return;
    }

    try {
      if (recognition) {
        recognition.abort();
      }
    } catch(e) {}

    recognition = new SR();
    recognition.lang = 'bn-BD';
    recognition.continuous = false;     // অ্যান্ড্রয়েড ডুপ্লিকেট রোধের মূল সমাধান
    recognition.interimResults = false;  // শুধু চূড়ান্ত বাক্য গ্রহণ করবে

    recognition.onstart = function() {
      mic.classList.add('recording');
      status.textContent = '🔴 কথা শুনছে... কথা বলা শেষে নিচের বাটনে চাপুন';
    };

    recognition.onresult = function(event) {
      var sentence = '';
      if (event.results && event.results[0] && event.results[0][0]) {
        sentence = event.results[0][0].transcript.trim();
      }
      if (sentence) {
        fullText += (fullText ? ' ' : '') + sentence;
        live.textContent = fullText;
      }
    };

    recognition.onerror = function(event) {
      // স্পিচ না পেলেও লিসেনিং বজায় রাখা
    };

    recognition.onend = function() {
      // যদি ইউজার নিজে বন্ধ না করে, সাথে সাথে পরবর্তী বাক্যের জন্য ফ্রেশ সেশন চালু হবে
      if (isRecording) {
        try {
          recognition.start();
        } catch(e) {
          setTimeout(function() {
            if (isRecording) startListening();
          }, 150);
        }
      } else {
        mic.classList.remove('recording');
      }
    };

    try {
      recognition.start();
    } catch(e) {}
  }

  mic.addEventListener('click', function() {
    if (!isRecording) {
      isRecording = true;
      fullText = '';
      live.textContent = 'কথা বলুন...';
      startListening();
    } else {
      isRecording = false;
      if (recognition) recognition.stop();
      mic.classList.remove('recording');
      status.textContent = 'থামানো হয়েছে';
    }
  });

  finishBtn.addEventListener('click', function() {
    isRecording = false;
    if (recognition) recognition.stop();
    sendToParentAndClose();
  });

  window.onload = function() {
    isRecording = true;
    startListening();
  };
})();
</script>
</body>
</html>
