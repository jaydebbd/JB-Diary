<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>ভয়েস নোটপ্যাড — অনলাইন ডায়েরি</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f4f9; color: #222; padding: 12px; }
    .card { width: min(100%, 540px); background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 10px 35px rgba(0,0,0,.08); text-align: center; }
    h1 { font-size: 20px; margin: 4px 0 12px; color: #1a73e8; }
    
    .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 14px; }
    .mic { width: 78px; height: 78px; border: 0; border-radius: 50%; background: linear-gradient(135deg,#6a1b9a,#8e24aa); color: #fff; font-size: 34px; cursor: pointer; box-shadow: 0 6px 18px rgba(106,27,154,.28); transition: .2s; }
    .mic.recording { background: linear-gradient(135deg,#d93025,#b31412); animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 14px rgba(217,48,37,.16); } }
    
    #status { font-size: 14px; font-weight: 600; color: #555; }
    
    .box-title { text-align: left; font-size: 13px; font-weight: 600; color: #666; margin-top: 10px; margin-bottom: 5px; }
    #noteArea {
      width: 100%;
      height: 180px;
      padding: 12px;
      font-size: 15.5px;
      line-height: 1.6;
      border: 1.5px solid #c2d7fa;
      border-radius: 12px;
      background: #fbfcfe;
      outline: none;
      resize: vertical;
      color: #2c3e50;
      font-family: inherit;
    }
    #noteArea:focus { border-color: #1a73e8; background: #fff; box-shadow: 0 0 0 2px rgba(26,115,232,0.15); }
    
    .action-btns { display: flex; gap: 10px; margin-top: 14px; }
    .btn-clear { flex: 1; padding: 12px; background: #f1f3f4; color: #555; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-submit { flex: 2; padding: 12px; background: #1e8e3e; color: #fff; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 3px 10px rgba(30,142,62,.25); }
    .btn-submit:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎙️ ভয়েস ডায়েরি নোট</h1>
    
    <div class="mic-wrap">
      <button id="micBtn" class="mic" type="button" title="রেকর্ড চালু/বন্ধ করুন">🎙️</button>
      <div id="status">কথা বলতে মাইক চাপুন</div>
    </div>

    <div class="box-title">📝 লেখার বক্স (প্রয়োজনে সরাসরি এডিট করতে পারবেন):</div>
    <textarea id="noteArea" placeholder="মাইকে চাপ দিয়ে কথা বলুন, এটি একটানা শুনতেই থাকবে... আপনি চাইলে কথা বলার মাঝে এখানে হাত দিয়ে টাইপ বা এডিটও করতে পারেন।"></textarea>

    <div class="action-btns">
      <button id="clearBtn" class="btn-clear" type="button">মুছে ফেলুন</button>
      <button id="submitBtn" class="btn-submit" type="button">✅ ডায়েরিতে পাঠান ও ঠিক করুন</button>
    </div>
  </main>

<script>
(function(){
  'use strict';

  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var parentOrigin = params.get('parentOrigin') || '';

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;
  
  // ইউজার নিজে বাটন চেপে অফ না করা পর্যন্ত এটি true থাকবে
  var shouldKeepListening = false;
  var restartTimer = null;

  var micBtn = document.getElementById('micBtn');
  var status = document.getElementById('status');
  var noteArea = document.getElementById('noteArea');
  var clearBtn = document.getElementById('clearBtn');
  var submitBtn = document.getElementById('submitBtn');

  // সেশনের আগের স্থায়ী টেক্সট
  var baseText = '';

  function cleanAppend(base, addition) {
    base = (base || '').trim();
    addition = (addition || '').trim();
    if (!base) return addition;
    if (!addition) return base;
    return base + ' ' + addition;
  }

  function launchRecognition() {
    if (!shouldKeepListening) return;

    if (recognition) {
      try { recognition.abort(); } catch(e) {}
    }

    recognition = new SR();
    recognition.lang = 'bn-BD';
    recognition.continuous = true;
    recognition.interimResults = true;

    // বর্তমান বক্সের লেখাকে স্থায়ী ভিত্তি হিসেবে ধরে নেওয়া
    baseText = noteArea.value;

    recognition.onstart = function() {
      micBtn.classList.add('recording');
      micBtn.innerHTML = '🛑';
      status.textContent = '🔴 কথা শুনছে... (বন্ধ করতে বাটনে চাপুন)';
    };

    recognition.onresult = function(event) {
      var currentFinals = '';
      var currentInterim = '';

      for (var i = event.resultIndex; i < event.results.length; ++i) {
        var chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          currentFinals += chunk;
        } else {
          currentInterim += chunk;
        }
      }

      var combinedLive = (currentFinals + currentInterim).trim();
      if (combinedLive) {
        noteArea.value = cleanAppend(baseText, combinedLive);
        noteArea.scrollTop = noteArea.scrollHeight;
      }

      // যদি কোনো চূড়ান্ত অংশ পাওয়া যায়, তবে তা স্থায়ী টেক্সটে যুক্ত করে রাখা
      if (currentFinals.trim()) {
        baseText = cleanAppend(baseText, currentFinals);
      }
    };

    recognition.onerror = function(event) {
      // no-speech হলেও যেন সেশন না কাটে
    };

    recognition.onend = function() {
      // ইউজার নিজে না থামালে স্বয়ংক্রিয়ভাবে мгновенно (মুহূর্তের মধ্যে) ফ্রেশ সেশন চালু হবে
      if (shouldKeepListening) {
        baseText = noteArea.value; // বক্সে যা জমা হয়েছে তা লক করে রাখা
        clearTimeout(restartTimer);
        restartTimer = setTimeout(function() {
          if (shouldKeepListening) {
            launchRecognition();
          }
        }, 100);
      } else {
        micBtn.classList.remove('recording');
        micBtn.innerHTML = '🎙️';
        status.textContent = 'থামানো হয়েছে (আবার শুরু করতে মাইক চাপুন)';
      }
    };

    try {
      recognition.start();
    } catch(e) {
      if (shouldKeepListening) {
        clearTimeout(restartTimer);
        restartTimer = setTimeout(launchRecognition, 250);
      }
    }
  }

  function startAll() {
    if (!SR) {
      alert('আপনার ব্রাউজারে ভয়েস সাপোর্ট নেই। Chrome বা Edge ব্যবহার করুন।');
      return;
    }
    shouldKeepListening = true;
    baseText = noteArea.value;
    launchRecognition();
  }

  function stopAll() {
    shouldKeepListening = false;
    clearTimeout(restartTimer);
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
    micBtn.classList.remove('recording');
    micBtn.innerHTML = '🎙️';
    status.textContent = 'থামানো হয়েছে (আবার শুরু করতে মাইক চাপুন)';
  }

  micBtn.addEventListener('click', function() {
    if (!shouldKeepListening) {
      startAll();
    } else {
      stopAll();
    }
  });

  clearBtn.addEventListener('click', function() {
    if (confirm('আপনি কি বক্সের সব লেখা মুছে ফেলতে চান?')) {
      noteArea.value = '';
      baseText = '';
      if (shouldKeepListening) {
        stopAll();
      }
    }
  });

  submitBtn.addEventListener('click', function() {
    stopAll();

    var textToSend = noteArea.value.trim();
    if (!textToSend) {
      alert('বক্সে কোনো লেখা নেই!');
      return;
    }

    status.textContent = '📨 ডায়েরিতে পাঠানো হচ্ছে...';
    submitBtn.disabled = true;

    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({
        type: 'DIARY_VOICE_TRANSCRIPT',
        token: token,
        text: textToSend
      }, parentOrigin || '*');[span_2](start_span)[span_2](end_span)[span_3](start_span)[span_3](end_span)

      setTimeout(function() {
        window.close();[span_4](start_span)[span_4](end_span)
      }, 500);
    } else {
      alert('মূল ডায়েরি উইন্ডো পাওয়া যায়নি। অনুগ্রহ করে ডায়েরির পেজ থেকে এটি খুলুন।');[span_5](start_span)[span_5](end_span)
      submitBtn.disabled = false;
      status.textContent = '⚠️ পাঠানো ব্যর্থ হয়েছে';
    }
  });

  // পেজে প্রবেশ করলে বাটন চাপ দিয়ে অন করার জন্য প্রস্তুত থাকবে
})();
</script>
</body>
</html>
