<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>স্মার্ট AI ভয়েস ডায়েরি</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f4f9; color: #222; padding: 12px; }
    .card { width: min(100%, 540px); background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 10px 35px rgba(0,0,0,.08); text-align: center; }
    h1 { font-size: 20px; margin: 4px 0 12px; color: #1a73e8; }
    
    .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 14px; }
    .mic { width: 78px; height: 78px; border: 0; border-radius: 50%; background: linear-gradient(135deg,#6a1b9a,#8e24aa); color: #fff; font-size: 34px; cursor: pointer; box-shadow: 0 6px 18px rgba(106,27,154,.28); transition: .2s; }
    .mic.recording { background: linear-gradient(135deg,#d93025,#b31412); animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 14px rgba(217,48,37,.16); } }
    
    #status { font-size: 14px; font-weight: 600; color: #555; }
    
    .box-title { text-align: left; font-size: 13px; font-weight: 600; color: #666; margin-top: 10px; margin-bottom: 5px; }
    #noteArea {
      width: 100%;
      height: 180px;
      padding: 12px;
      font-size: 15.5px;
      line-height: 1.6;
      border: 1.5px solid #c2d7fa;
      border-radius: 12px;
      background: #fbfcfe;
      outline: none;
      resize: vertical;
      color: #2c3e50;
      font-family: inherit;
    }
    #noteArea:focus { border-color: #1a73e8; background: #fff; box-shadow: 0 0 0 2px rgba(26,115,232,0.15); }
    
    .action-btns { display: flex; gap: 10px; margin-top: 14px; }
    .btn-clear { flex: 1; padding: 12px; background: #f1f3f4; color: #555; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-submit { flex: 2; padding: 12px; background: #1e8e3e; color: #fff; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 3px 10px rgba(30,142,62,.25); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { background: #94d3a2; cursor: not-allowed; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎙 স্মার্ট AI ভয়েস ডায়েরি</h1>
    
    <div class="mic-wrap">
      <button id="micBtn" class="mic" type="button" title="রেকর্ড চালু/বন্ধ করুন">🎙</button>
      <div id="status">কথা বলতে মাইক চাপুন</div>
    </div>

    <div class="box-title">📝 লেখার বক্স (প্রয়োজনে সরাসরি এডিট করতে পারবেন):</div>
    <textarea id="noteArea" placeholder="মাইক চেপে কথা বলুন, থামানোর পর স্বয়ংক্রিয়ভাবে নির্ভুল বানান ও দাঁড়ি-কমা সহ লেখা চলে আসবে..."></textarea>

    <div class="action-btns">
      <button id="clearBtn" class="btn-clear" type="button">মুছে ফেলুন</button>
      <button id="submitBtn" class="btn-submit" type="button">✅ ডায়েরিতে পাঠান</button>
    </div>
  </main>

<script>
(function(){
  'use strict';

  // আপনার Groq API Key এখানে বসান
  var GROQ_API_KEY = "YOUR_GROQ_API_KEY_HERE";

  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var parentOrigin = params.get('parentOrigin') || '*';

  var micBtn = document.getElementById('micBtn');
  var status = document.getElementById('status');
  var noteArea = document.getElementById('noteArea');
  var clearBtn = document.getElementById('clearBtn');
  var submitBtn = document.getElementById('submitBtn');

  var mediaRecorder = null;
  var audioChunks = [];
  var isRecording = false;

  async function startRecording() {
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = function(e) {
        if (e.data.size > 0) {
          audioChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = async function() {
        stream.getTracks().forEach(track => track.stop());
        var audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        await transcribeAudio(audioBlob);
      };

      mediaRecorder.start();
      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.innerHTML = '🛑';
      status.textContent = '🔴 কথা শুনছি... শেষ করতে আবার চাপুন';
    } catch(err) {
      status.textContent = '⚠️ মাইক্রোফোন অ্যাক্সেস পাওয়া যায়নি';
    }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.innerHTML = '🎙️';
      status.textContent = '⏳ লেখা তৈরি হচ্ছে...';
    }
  }

  async function transcribeAudio(audioBlob) {
    if (GROQ_API_KEY === "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") {
      alert("অনুগ্রহ করে কোডে আপনার Groq API Key টি বসান!");
      status.textContent = "API Key প্রয়োজন";
      return;
    }

    var formData = new FormData();
    formData.append("file", audioBlob, "audio.webm");
    formData.append("model", "whisper-large-v3");
    formData.append("language", "bn");
    // প্রমিত বাংলা ব্যাকরণ, সঠিক বানান ও দাঁড়ি-কমার নির্দেশনা
    formData.append("prompt", "প্রমিত বাংলা ব্যাকরণ, সঠিক বানান ও উপযুক্ত দাঁড়ি-কমা ব্যবহার করে লিখুন। যেমন: অনেক দিন আগের কথা, এক দেশে ছিল এক রাজা।");
    formData.append("temperature", "0");
    formData.append("response_format", "json");

    try {
      var response = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + GROQ_API_KEY
        },
        body: formData
      });

      var data = await response.json();
      if (data.text) {
        var newText = data.text.trim();
        var prevText = noteArea.value.trim();
        noteArea.value = prevText ? (prevText + " " + newText) : newText;
        status.textContent = '✅ সফলভাবে লেখা সম্পন্ন হয়েছে!';
      } else {
        status.textContent = '⚠️ কথা স্পষ্ট বোঝা যায়নি, আবার চেষ্টা করুন';
      }
    } catch(err) {
      status.textContent = '⚠️ টেক্সট কনভার্ট করতে সমস্যা হয়েছে';
    }
  }

  micBtn.addEventListener('click', function() {
    if (!isRecording) {
      startRecording();
    } else {
      stopRecording();
    }
  });

  clearBtn.addEventListener('click', function() {
    if (confirm('আপনি কি বক্সের সব লেখা মুছে ফেলতে চান?')) {
      if (isRecording) stopRecording();
      noteArea.value = '';
      status.textContent = 'কথা বলতে মাইক চাপুন';
    }
  });

  submitBtn.addEventListener('click', function() {
    if (isRecording) stopRecording();

    var textToSend = noteArea.value.trim();
    if (!textToSend) {
      alert('বক্সে কোনো লেখা নেই!');
      return;
    }

    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({
        type: 'DIARY_VOICE_TRANSCRIPT',
        token: token,
        text: textToSend
      }, parentOrigin);

      window.close();
    } else {
      alert('মূল ডায়েরি উইন্ডো পাওয়া যায়নি। অনুগ্রহ করে ডায়েরির পেজ থেকে এটি খুলুন।');
    }
  });

})();
</script>
</body>
</html>
