<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <title>ভয়েস রেকর্ডার - অনলাইন ডায়েরি</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #f5f7fb;
      color: #202124;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 20px;
      padding: 28px 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      text-align: center;
    }
    h2 {
      margin: 0 0 6px;
      font-size: 20px;
      color: #1a73e8;
    }
    .desc {
      font-size: 13px;
      color: #5f6368;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .mic-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }
    #micButton {
      width: 100px;
      height: 100px;
      border: 0;
      border-radius: 50%;
      background: #1a73e8;
      color: #fff;
      font-size: 42px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(26,115,232,0.3);
      transition: transform .15s, background .15s;
    }
    #micButton:active { transform: scale(0.96); }
    #micButton.recording {
      background: #d93025;
      animation: pulse 1.3s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(217,48,37,0.4); }
      70% { box-shadow: 0 0 0 18px rgba(217,48,37,0); }
      100% { box-shadow: 0 0 0 0 rgba(217,48,37,0); }
    }
    #status {
      min-height: 22px;
      font-size: 14px;
      font-weight: 600;
      color: #5f6368;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎙️ ভয়েস রেকর্ডার</h2>
    <div class="desc">
      কথা বলতে মাইকে চাপ দিন → কথা শেষ হলে আবার চাপুন। লেখা স্বয়ংক্রিয়ভাবে ডায়েরিতে চলে যাবে।
    </div>

    <div class="mic-wrap">
      <button id="micButton" type="button" aria-label="রেকর্ড শুরু/বন্ধ করুন">🎙️</button>
    </div>

    <div id="status">কথা বলতে মাইকে চাপ দিন</div>
  </div>

<script>
(function () {
  'use strict';

  var MODELS = ['gemini-3.8-flash'];

  var micButton = document.getElementById('micButton');
  var statusEl = document.getElementById('status');

  var token = '';
  var parentOrigin = '';
  var diaryApiKey = '';
  try {
    var params = new URLSearchParams(window.location.search || '');
    token = params.get('token') || '';
    parentOrigin = params.get('parentOrigin') || '';
    diaryApiKey = params.get('key') || '';
  } catch (e) {}

  var mediaRecorder = null;
  var mediaStream = null;
  var audioChunks = [];
  var isRecording = false;
  var isProcessing = false;

  function setStatus(msg) {
    statusEl.textContent = msg;
  }

  function sleep(ms) {
    return new Promise(function(resolve) { setTimeout(resolve, ms); });
  }

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onloadend = function () {
        var res = String(reader.result || '');
        var comma = res.indexOf(',');
        if (comma < 0) return reject(new Error('Audio রূপান্তর ব্যর্থ হয়েছে'));
        resolve(res.slice(comma + 1));
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function transcribeWithGemini(audioBlob, mimeType) {
    if (!diaryApiKey) {
      throw new Error('ডায়েরিতে Gemini API Key সেট করা নেই!');
    }
    var base64Audio = await blobToBase64(audioBlob);
    var cleanMime = (mimeType || 'audio/webm').split(';')[0];
    var prompt =
      'এই অডিওতে একজন ব্যক্তি বাংলা ভাষায় কথা বলেছেন। অডিওটি মনোযোগ দিয়ে শুনে তিনি যা বলেছেন তা হুবহু পরিষ্কার ও সঠিক যতিচিহ্নসহ বাংলায় লিখে দিন।\n\n' +
      'নিয়ম:\n' +
      '১. বক্তার মূল বক্তব্য হুবহু রাখবেন।\n' +
      '২. কোনো ভূমিকা বা ব্যাখ্যা লিখবেন না, শুধু চূড়ান্ত বাংলা লেখাটি দিন।';

    var lastError = null;

    for (var m = 0; m < MODELS.length; m++) {
      var modelName = MODELS[m];
      var endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/' + modelName + ':generateContent';

      for (var attempt = 1; attempt <= 3; attempt++) {
        try {
          var response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-goog-api-key': diaryApiKey
            },
            body: JSON.stringify({
              contents: [{
                role: 'user',
                parts: [
                  { text: prompt },
                  { inlineData: { mimeType: cleanMime, data: base64Audio } }
                ]
              }],
              generationConfig: { temperature: 0.1 }
            })
          });

          var json = await response.json();
          if (!response.ok) {
            var msg = (json && json.error && json.error.message) ? json.error.message : ('HTTP ' + response.status);
            var err = new Error(msg);
            if (response.status === 429 || response.status === 503 || msg.toLowerCase().indexOf('high demand') !== -1) {
              if (attempt < 3) {
                setStatus('⏳ সার্ভারে চাপ বেশি (' + attempt + '/2), অপেক্ষা করে আবার চেষ্টা হচ্ছে...');
                await sleep(1500);
                continue;
              }
            }
            throw err;
          }

          var candidates = json.candidates || [];
          if (candidates.length && candidates[0].content && candidates[0].content.parts) {
            var text = candidates[0].content.parts[0].text || '';
            return text.replace(/^\s*```(?:text|plaintext|markdown)?\s*/i, '').replace(/\s*```\s*$/i, '').trim();
          }
          return '';
        } catch (e) {
          lastError = e;
          if (attempt < 3 && e.message && e.message.toLowerCase().indexOf('high demand') !== -1) {
            await sleep(1500);
            continue;
          }
          break;
        }
      }
    }
    throw lastError || new Error('অডিও থেকে লেখা রূপান্তর করা যায়নি।');
  }

  function stopTracks() {
    if (mediaStream) {
      mediaStream.getTracks().forEach(function(t) { try { t.stop(); } catch(e){} });
      mediaStream = null;
    }
  }

  function resetMic() {
    isRecording = false;
    micButton.classList.remove('recording');
    micButton.textContent = '🎙️';
    micButton.disabled = false;
  }

  function startRecording() {
    if (!diaryApiKey) {
      setStatus('⚠️ মূল ডায়েরির মেনু থেকে আগে API Key দিন!');
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('❌ এই ব্রাউজারে মাইক্রোফোন ব্যবহারের অনুমতি নেই।');
      return;
    }

    audioChunks = [];
    var mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm');

    navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    }).then(function(stream) {
      mediaStream = stream;
      mediaRecorder = new MediaRecorder(stream, { mimeType: mime });

      mediaRecorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async function() {
        stopTracks();
        var audioBlob = new Blob(audioChunks, { type: mime });
        audioChunks = [];
        if (!audioBlob.size) {
          isProcessing = false;
          resetMic();
          setStatus('⚠️ কোনো অডিও রেকর্ড হয়নি।');
          return;
        }

        isProcessing = true;
        micButton.disabled = true;
        setStatus('🤖 কথা বাংলায় রূপান্তর হচ্ছে...');

        try {
          var transcript = await transcribeWithGemini(audioBlob, mime);
          if (transcript) {
            sendToDiary(transcript);
          } else {
            setStatus('⚠️ কোনো লেখা রূপান্তর করা যায়নি।');
            isProcessing = false;
            resetMic();
          }
        } catch(err) {
          setStatus('❌ ' + (err.message || 'রূপান্তর ব্যর্থ হয়েছে'));
          isProcessing = false;
          resetMic();
        }
      };

      mediaRecorder.start(250);
      isRecording = true;
      micButton.classList.add('recording');
      micButton.textContent = '⏹️';
      setStatus('🔴 রেকর্ড হচ্ছে... শেষ হলে আবার চাপুন।');
    }).catch(function() {
      resetMic();
      setStatus('❌ মাইক্রোফোন চালু করা যায়নি!');
    });
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
      isRecording = false;
      micButton.classList.remove('recording');
      micButton.textContent = '🎙️';
      setStatus('⏳ প্রসেস হচ্ছে...');
    }
  }

  function sendToDiary(text) {
    if (!parentOrigin || !token || !window.opener || window.opener.closed) {
      setStatus('❌ মূল ডায়েরি উইন্ডো পাওয়া যায়নি।');
      isProcessing = false;
      resetMic();
      return;
    }
    try {
      window.opener.postMessage({ type: 'DIARY_VOICE_TRANSCRIPT', token: token, text: text }, parentOrigin);
      setStatus('✅ লেখা ডায়েরিতে পাঠানো হয়েছে!');
      setTimeout(function() { window.close(); }, 500);
    } catch(e) {
      setStatus('❌ লেখা পাঠানো যায়নি।');
      isProcessing = false;
      resetMic();
    }
  }

  micButton.addEventListener('click', function() {
    if (isProcessing) return;
    if (isRecording) stopRecording(); else startRecording();
  });

  if (!diaryApiKey) {
    setStatus('⚠️ মূল ডায়েরির মেনু থেকে আগে API Key দিন!');
  } else {
    setStatus('কথা বলতে মাইকে চাপ দিন');
  }
})();
</script>
</body>
</html>
